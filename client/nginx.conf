server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints its assets, so they can be cached hard. index.html must
  # not be, or a deploy leaves browsers holding a stale asset manifest.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The dev server proxies /api to keep requests same-origin (see
  # vite.config.ts). Production needs the same thing, or the browser would be
  # making cross-origin calls the app is not built for.
  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long enough for a report or a bulk action to finish.
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
  }

  # Client-side routing: any unknown path is a React route, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
